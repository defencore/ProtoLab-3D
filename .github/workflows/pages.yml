name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the complete test suite instead of affected elements
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select affected tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      shards: ${{ steps.matrix.outputs.shards }}
      has-tests: ${{ steps.matrix.outputs.has-tests }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Find the last successful push
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: node scripts/ci/successful-base.mjs
      - name: Plan affected elements and dependent tests
        env:
          VERIFIED_BASE: ${{ steps.baseline.outputs.base }}
          FORCE_FULL: ${{ inputs.full_tests }}
        run: |
          args=(--head "$GITHUB_SHA" --output test-results/ci/test-plan.json)
          if [ -n "$VERIFIED_BASE" ]; then args+=(--base "$VERIFIED_BASE"); fi
          if [ "$FORCE_FULL" = "true" ]; then args+=(--full); fi
          node --import tsx scripts/ci/test-plan.ts "${args[@]}"
      - name: Prepare selected test groups
        id: matrix
        run: node scripts/ci/run-tests.mjs matrix --plan test-results/ci/test-plan.json
      - name: Save test plan
        uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: test-results/ci/test-plan.json
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read test plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: test-results/ci
      - name: Check repository hygiene
        run: npm run check:artifacts
      - name: Check repository language and README scope
        run: npm run check:language
      - name: Check TypeScript and test contracts
        run: npm run typecheck:tests
      - name: Check affected part packages and presets
        run: node scripts/ci/run-tests.mjs packages --plan test-results/ci/test-plan.json
      - name: Check affected Python catalog importers
        run: node scripts/ci/run-tests.mjs python --plan test-results/ci/test-plan.json
      - name: Build static app
        run: npm run build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  geometry:
    name: Affected tests ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read test plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: test-results/ci
      - name: Verify selected geometry and generators
        id: geometry-tests
        run: |
          set -o pipefail
          mkdir -p test-results/ci
          node scripts/ci/run-tests.mjs run --plan test-results/ci/test-plan.json --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.shards }} 2>&1 | tee test-results/ci/test-output.log
      - name: Summarize failed tests
        if: failure() && steps.geometry-tests.outcome == 'failure'
        run: |
          echo '### Failed affected tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full assertion details are attached to this test group.' >> "$GITHUB_STEP_SUMMARY"
          grep '^not ok ' test-results/ci/test-output.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload failed test log
        if: failure() && steps.geometry-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.shard }}
          path: test-results/ci/test-output.log
          retention-days: 7

  deploy:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.plan.result == 'success' && needs.build.result == 'success' &&
      (needs.geometry.result == 'success' || needs.geometry.result == 'skipped')
    needs: [plan, build, geometry]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
